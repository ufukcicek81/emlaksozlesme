name: Android APK

on:
  push:
    branches: [main, ccr-9b52a30d-r5g7bz]
    paths:
      - "index.html"
      - "assets/**"
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # İsteğe bağlı sabit imza anahtarı (güncellemelerin eski sürümün üzerine kurulabilmesi için).
      # Repo Settings > Secrets > Actions: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Yoksa APK debug anahtarıyla imzalanır.
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/release/app-release.apk "EmlakSozlesmem-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EmlakSozlesmem-apk
          path: EmlakSozlesmem-*.apk

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Emlak Sözleşmem Android v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Telefona indirip kurun (Ayarlar > Bilinmeyen kaynaklardan yüklemeye izin verin).
            Kaynak: ${{ github.ref_name }} @ ${{ github.sha }}
          files: EmlakSozlesmem-*.apk
